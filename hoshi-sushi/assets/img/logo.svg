<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 95" width="152" height="95">
  <!-- logo do modelo: marca fictícia "Hoshi" (星 = estrela), selo vermelho legível nos temas claro e escuro -->
  <rect x="2" y="17" width="148" height="61" rx="8" fill="#a91110"/>
  <circle cx="34" cy="47.5" r="22" fill="none" stroke="#f6f2ec" stroke-width="2"/>
  <text x="34" y="58" text-anchor="middle" font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif" font-size="29" font-weight="700" fill="#f6f2ec">星</text>
  <text x="64" y="52" font-family="Impact,'Arial Black','Helvetica Neue',sans-serif" font-size="26" fill="#f6f2ec" letter-spacing=".5">HOSHI</text>
  <text x="65" y="66" font-family="Arial,Helvetica,sans-serif" font-size="9.5" font-weight="700" fill="#f6f2ec" opacity=".8" letter-spacing="3">SUSHI</text>
</svg>
